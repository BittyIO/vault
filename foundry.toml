[profile.default]
src = "src"
out = "out"
test = "test/local"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
auto_detect_remappings = false

[profile.ci]
src = "src"
out = "out"
test = "test/local"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = true

# TRON. Same sources and settings, targeting the TVM: mainnet and Nile both run PUSH0, TSTORE/TLOAD and
# MCOPY (probed 2026-11-07), so cancun. Its own output directory, read by tron/account.mjs.
[profile.tron]
evm_version = "cancun"
out = "out-tron"

# forge's linter and formatter cannot parse Yul objects; the one Yul source is TRON's staking opcodes,
# which the account delegatecalls (src/account/TronStakeOps.yul, copied from protocol-store).
[lint]
ignore = ["src/account/TronStakeOps.yul"]

[fmt]
ignore = ["src/account/TronStakeOps.yul"]
