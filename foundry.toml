[profile.default]
src = "src"
out = "out"
test = "test/local"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
memory_limit = 43554432
gas_limit = 9223372036854775807
gas_price = 0
optimizer = true
optimizer_runs = 10000
via_ir = true

remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "guard-contracts/=lib/guard-contracts/",
    "protocol-contracts/=lib/protocol-contracts/",
    "solmate/=lib/solmate/src/",
    "safe-contracts/=lib/safe-smart-account/contracts/",
]

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = true

[profile.deploy]
src = "src"
out = "out-deploy"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = true
# Deliberately NO bytecode_hash/cbor_metadata override and NO `libraries` pin.
#
# Both change the init code and therefore every CREATE2 address derived from it. solc records the
# `libraries` setting in each contract's metadata, so pinning shifts even contracts that link nothing.
#
# This is the configuration the live Sepolia, Base and mainnet deployment was built with, and the
# vanity salts were mined against that init code. Verified against three independent addresses that
# reproduce only under it: VaultLogic 0xc66aef7C…, factory 0x580082Fb…, forwarder 0x00006758bf….

remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "guard-contracts/=lib/guard-contracts/",
    "protocol-contracts/=lib/protocol-contracts/",
    "solmate/=lib/solmate/src/",
    "safe-contracts/=lib/safe-smart-account/contracts/",
]

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# The Gnosis Safe integration suite, walled off in its own profile and its own artifact directory.
#
# Safe will not compile under `via_ir = true` — its assembly predates the memory-safe annotation, so
# the IR pipeline hits stack-too-deep inside execTransaction. Compiling it in-tree with a per-path
# exemption does work, but it drags every Bitty source the suite touches into a SECOND compilation:
# two artifacts both named BittyV1Vault, `forge build --sizes` reporting the wrong one at 26KB, and
# `forge inspect` / `forge verify-contract` newly ambiguous.
#
# So this suite gets its own everything. Nothing here can reach the artifacts that get deployed, and
# the default build is byte-for-byte what it was before Safe was ever added.
#
#   FOUNDRY_PROFILE=safe forge test
[profile.safe]
src = "src"
out = "out-safe"
test = "test/safe"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
via_ir = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "guard-contracts/=lib/guard-contracts/",
    "protocol-contracts/=lib/protocol-contracts/",
    "solmate/=lib/solmate/src/",
    "safe-contracts/=lib/safe-smart-account/contracts/",
]
