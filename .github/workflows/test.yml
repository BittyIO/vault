name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned, not "stable". Foundry v1.8.0 (2026-08-27) added network-family detection for the
      # Monad/Tempo work, and it probes the fork endpoint with anvil_nodeInfo. Alchemy answers that
      # with HTTP 400 rather than a 200 carrying a JSON-RPC error, which forge treats as fatal — so
      # every vm.createSelectFork test failed the day that release landed, with no change on our side.
      # Raise this deliberately once a release is confirmed to fork against Alchemy.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}

      - name: Run Forge coverage
        run: |
          forge coverage --ir-minimum --no-match-coverage 'test|node_modules|script|src/libs' --report lcov
        id: coverage
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}

      - uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: true
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          skip_validation: true
